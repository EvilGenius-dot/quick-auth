        <text x="1011" y="277" font-size="16" fill="#dce4f3">★</text>
        <text x="690" y="338" font-family="'SFMono-Regular',Consolas,monospace" font-size="29" font-weight="500" letter-spacing="3" fill="#f1f4fc">482 901</text>
        <rect x="856" y="322" width="9" height="12" rx="2" fill="none" stroke="#8d98ae"/>
        <path d="M860 319H868V330" fill="none" stroke="#8d98ae"/>
