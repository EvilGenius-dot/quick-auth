<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Quick Auth: Your codes, one click away</title>
  <desc id="desc">Illustrative authenticator panel with fictional accounts, search, countdowns, import and export.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b0c10"/><stop offset="1" stop-color="#14161c"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#414651"/><stop offset="1" stop-color="#15171d"/></linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity=".55"/></filter>
  </defs>
  <rect width="1200" height="650" rx="24" fill="url(#bg)"/>
  <circle cx="1110" cy="45" r="230" fill="#232630" opacity=".6"/>
  <circle cx="110" cy="650" r="215" fill="#15171e" opacity=".6"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans CJK SC',sans-serif">
