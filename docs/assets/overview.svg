    <circle cx="84" cy="93" r="4" fill="#dde4f0"/>
    <text x="96" y="98" font-size="12" font-weight="600" letter-spacing="1" fill="#bac4d6">macOS + WINDOWS</text>
    <text x="62" y="176" font-size="56" font-weight="700" letter-spacing="-2" fill="#f0f2f8">Quick Auth</text>
    <text x="66" y="243" font-size="35" font-weight="600" fill="#f0f2f8">Your codes. Right here.</text>
    <text x="67" y="290" font-size="18" fill="#969eaf">From your browser to your menu bar or tray.</text>
    <text x="67" y="319" font-size="18" fill="#969eaf">Search, copy and back up. All on your device.</text>
    <g fill="#191c23" stroke="#30343f">
      <rect x="66" y="371" width="138" height="42" rx="12"/>
      <rect x="216" y="371" width="138" height="42" rx="12"/>
      <rect x="366" y="371" width="138" height="42" rx="12"/>
    </g>
    <g font-size="14" font-weight="500" fill="#d1d8e5" text-anchor="middle">
      <text x="135" y="397">Screen QR scan</text><text x="285" y="397">Encrypted backup</text><text x="435" y="397">On-device storage</text>
    </g>
    <line x1="67" y1="473" x2="502" y2="473" stroke="#30343f"/>
    <text x="67" y="511" font-size="14" fill="#9da5b6">English / 中文</text>
    <text x="238" y="511" font-size="14" fill="#9da5b6">Works offline</text>
    <text x="351" y="511" font-size="14" fill="#9da5b6">No cloud account</text>
    <text x="67" y="587" font-size="12" letter-spacing=".4" fill="#697385">ILLUSTRATIVE UI · DEMO DATA</text>
