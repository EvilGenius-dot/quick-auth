      <path d="M797 548V558H811V548M804 555V542M800 546L804 542L808 546" fill="none" stroke="#cfd8eb" stroke-width="1.3"/>
      <text x="818" y="559" font-size="12" fill="#cfd8eb">Export backup</text>
      <text x="967" y="559" font-size="10" fill="#77849b">v1.2.1</text>
      <text x="1024" y="560" font-size="17" fill="#9ba8bf">⚙</text>
