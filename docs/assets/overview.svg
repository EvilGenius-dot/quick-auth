    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#20a38a"/><stop offset="1" stop-color="#08695e"/></linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#123f35" flood-opacity=".11"/></filter>
  </defs>
