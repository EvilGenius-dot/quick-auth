<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Quick Auth: Your codes, one click away</title>
  <desc id="desc">Illustrative authenticator panel with fictional accounts, search, countdowns, import and export.</desc>
  <defs>
