    <text x="67" y="290" font-size="18" fill="#969eaf">从浏览器迁移，在菜单栏与托盘验证。</text>
    <text x="67" y="319" font-size="18" fill="#969eaf">搜索、复制、备份，全部在本机完成。</text>
