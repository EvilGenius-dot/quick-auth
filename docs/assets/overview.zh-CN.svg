    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#53507a"/><stop offset="1" stop-color="#1d182b"/></linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity=".55"/></filter>
  </defs>
  <rect width="1200" height="650" rx="24" fill="url(#bg)"/>
  <circle cx="1110" cy="45" r="230" fill="#27243c" opacity=".6"/>
  <circle cx="110" cy="650" r="215" fill="#171c2d" opacity=".6"/>
